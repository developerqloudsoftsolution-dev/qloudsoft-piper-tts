# ==============================================================================
# Render Blueprint Specification for Meta MMS-TTS Hindi Microservice
# ==============================================================================
services:
  - type: web
    name: mms-hindi-tts-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEFAULT_VOICE
        value: facebook/mms-tts-hin
      - key: MMS_MODEL_ID
        value: facebook/mms-tts-hin
      - key: MAX_TEXT_LENGTH
        value: "1000"
      - key: LOG_LEVEL
        value: INFO
      - key: API_KEY
        sync: false # Set securely in Render dashboard or leave empty for open access
