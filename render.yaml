# ==============================================================================
# Render Blueprint Specification for Piper TTS Microservice
# ==============================================================================
services:
  - type: web
    name: piper-tts-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEFAULT_VOICE
        value: hi-IN-SwaraNeural
      - key: PIPER_MODEL
        value: hi_IN-priyamvada-medium
      - key: MAX_TEXT_LENGTH
        value: "1000"
      - key: LOG_LEVEL
        value: INFO
      - key: API_KEY
        sync: false # Set securely in Render dashboard or leave empty for open access
